name: Update visitor count snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Fetch current visitor count
        id: snapshot
        env:
          API_URL: https://vwrhwdy26e.execute-api.ap-southeast-1.amazonaws.com/visitors/current
        run: |
          set -euo pipefail

          if ! response=$(curl --fail --silent --show-error \
            --max-time 15 "$API_URL"); then
            echo "::warning::AWS API unavailable; keeping the existing snapshot."
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! jq -e '
            (.visitors | type == "number") and
            (.visitors >= 0) and
            (.visitors == (.visitors | floor))
          ' <<< "$response" >/dev/null; then
            echo "::warning::API response was invalid; keeping the existing snapshot."
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          visitors=$(jq -r '.visitors' <<< "$response")
          updated_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')

          jq -n \
            --argjson visitors "$visitors" \
            --arg updatedAt "$updated_at" \
            '{
              visitors: $visitors,
              updatedAt: $updatedAt,
              source: "aws"
            }' > frontend/visitor-count.json.tmp

          mv frontend/visitor-count.json.tmp frontend/visitor-count.json

          echo "Visitor count: $visitors"
          echo "Snapshot timestamp: $updated_at"
          echo "updated=true" >> "$GITHUB_OUTPUT"

      - name: Commit snapshot
        if: steps.snapshot.outputs.updated == 'true'
        run: |
          set -euo pipefail
          : "${GITHUB_OUTPUT:?GITHUB_OUTPUT is required}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add frontend/visitor-count.json

          if git diff --cached --quiet; then
            echo "Snapshot has not changed; no commit needed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore: update visitor count snapshot"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
        id: commit

      - name: Configure GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

      - name: Deploy GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
